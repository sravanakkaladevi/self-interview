<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>404 — Page Not Found | Growmetrik</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/jpeg" href="/assets/growmetrik-logo.jpg" />
<style>
:root{
  --background:#000000;
  --foreground:#F8FAFC;
  --brand-cyan:#1BD0FA;
  --brand-blue:#3B82F6;
  --brand-violet:#7A5AF8;
  --brand-grad:linear-gradient(120deg,#1BD0FA 0%,#3B82F6 52%,#7A5AF8 100%);
  --panel:rgba(255,255,255,0.04);
  --line:rgba(255,255,255,0.12);
  --text-muted:#94A3B8;
  --font:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--background);
  color:var(--foreground);
  font-family:var(--font);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.bg-glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle 380px at 20% 20%, rgba(27,208,250,0.12) 0%, transparent 70%),
    radial-gradient(circle 420px at 80% 80%, rgba(122,90,248,0.14) 0%, transparent 70%);
}
.card{
  position:relative;
  z-index:2;
  max-width:480px;
  width:100%;
  padding:42px 32px;
  border-radius:24px;
  background:rgba(10,13,20,0.75);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,0.6);
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 12px;
  border-radius:999px;
  background:rgba(239,68,68,0.12);
  border:1px solid rgba(239,68,68,0.25);
  color:#F87171;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  margin-bottom:20px;
}
h1{
  font-size:clamp(54px,12vw,72px);
  font-weight:900;
  line-height:1;
  letter-spacing:-0.04em;
  background:var(--brand-grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:12px;
}
h2{
  font-size:22px;
  font-weight:800;
  letter-spacing:-0.02em;
  margin-bottom:12px;
  color:#fff;
}
p{
  font-size:15px;
  line-height:1.6;
  color:var(--text-muted);
  margin-bottom:28px;
}
.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}
@media(min-width:480px){
  .actions{flex-direction:row;justify-content:center;}
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 24px;
  border-radius:12px;
  font-weight:700;
  font-size:14px;
  text-decoration:none;
  transition:transform 0.2s ease, opacity 0.2s ease;
  min-height:44px;
}
.btn--primary{
  background:#22C55E;
  color:#052212;
}
.btn--outline{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;
}
.btn:hover{
  transform:translateY(-2px);
  opacity:0.95;
}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="card">
  <span class="badge">404 Error</span>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you are looking for doesn’t exist or has moved. Return to our homepage or message us directly on WhatsApp.</p>
  <div class="actions">
    <a href="https://growmetrik.in/" class="btn btn--primary">Return Home →</a>
    <a href="https://wa.me/918074832297?text=Hi%20Growmetrik%2C%20I%20reached%20a%20404%20page" class="btn btn--outline" target="_blank" rel="noopener">Chat on WhatsApp</a>
  </div>
</div>
</body>
</html>
